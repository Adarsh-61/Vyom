/* Failsafe: if WebGL, the CDN modules or the renderer fail for any reason, a 2-D canvas still paints a living galaxy so the screen is never empty. */
(function(){
  var ready = false, failed = false, raf = 0, fb = null, ctx = null, st = null;
  window.__cosmosReady = function(){ ready = true; if (failed) stop(); };
  window.__cosmosFail = function(){ if (failed || ready) return; failed = true; start(); };
  setTimeout(function(){ if (!ready) window.__cosmosFail(); }, 14000);
  window.addEventListener('error', function(e){ var t = e && e.target; if (t && t.tagName === 'SCRIPT') window.__cosmosFail(); }, true);
  window.addEventListener('unhandledrejection', function(){ if (!ready) setTimeout(function(){ if (!ready) window.__cosmosFail(); }, 1500); });
  function rnd(s){ return function(){ s |= 0; s = s + 0x6D2B79F5 | 0; var t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function start(){
    fb = document.getElementById('fb'); if (!fb) return; fb.style.display = 'block';
    var v = document.getElementById('veil'); if (v) v.style.opacity = 0;
    ctx = fb.getContext('2d'); var R = rnd(7);
    st = { yaw:0.4, pitch:0.9, zoom:1, stars:[], bg:[], neb:[], drag:null };
    for (var i = 0; i < 9000; i++){ var arm = (R()*4)|0, r = Math.pow(R(), 0.7)*0.95, th = arm*Math.PI/2 + Math.log(0.05 + r)*2.7 + (R()-0.5)*0.55*(1.2 - r); var z = (R()-0.5)*0.06*(1.1 - r);
      st.stars.push([Math.cos(th)*r, Math.sin(th)*r, z, 0.5 + R()*0.5, R() < 0.2 ? 0 : R() < 0.5 ? 1 : 2]); }
    for (var j = 0; j < 1400; j++){ var q = Math.pow(R(), 1.6)*0.28, a = R()*6.283; st.stars.push([Math.cos(a)*q, Math.sin(a)*q, (R()-0.5)*0.12*q, 0.9, 1]); }
    for (var k = 0; k < 700; k++) st.bg.push([R(), R(), R(), R()]);
    for (var n = 0; n < 9; n++) st.neb.push([R(), R(), 0.12 + R()*0.25, R()]);
    fb.addEventListener('pointerdown', function(e){ st.drag = [e.clientX, e.clientY]; fb.style.cursor = 'grabbing'; });
    addEventListener('pointerup', function(){ st.drag = null; fb.style.cursor = 'grab'; });
    addEventListener('pointermove', function(e){ if (!st || !st.drag) return; st.yaw += (e.clientX - st.drag[0])*0.006; st.pitch = Math.max(0.15, Math.min(1.5, st.pitch + (e.clientY - st.drag[1])*0.005)); st.drag = [e.clientX, e.clientY]; });
    fb.addEventListener('wheel', function(e){ e.preventDefault(); st.zoom = Math.max(0.5, Math.min(6, st.zoom*Math.exp(-e.deltaY*0.0012))); }, { passive:false });
    loop();
  }
  function stop(){ cancelAnimationFrame(raf); if (fb) fb.style.display = 'none'; }
  function loop(t){
    raf = requestAnimationFrame(loop);
    var w = fb.width = innerWidth, h = fb.height = innerHeight, c = ctx;
    var g = c.createRadialGradient(w*0.5, h*0.56, 0, w*0.5, h*0.56, Math.max(w, h)*0.8); g.addColorStop(0, '#171d4a'); g.addColorStop(0.45, '#080b20'); g.addColorStop(1, '#02030a'); c.fillStyle = g; c.fillRect(0, 0, w, h);
    c.globalCompositeOperation = 'lighter';
    for (var i = 0; i < st.neb.length; i++){ var nb = st.neb[i], x = nb[0]*w, y = nb[1]*h, rr = nb[2]*Math.max(w, h); var gg = c.createRadialGradient(x, y, 0, x, y, rr); var hue = nb[3] < 0.5 ? '120,80,200' : '60,120,230'; gg.addColorStop(0, 'rgba(' + hue + ',0.10)'); gg.addColorStop(1, 'rgba(' + hue + ',0)'); c.fillStyle = gg; c.fillRect(x - rr, y - rr, rr*2, rr*2); }
    for (var b = 0; b < st.bg.length; b++){ var s = st.bg[b]; c.fillStyle = 'rgba(' + (200 + s[2]*55|0) + ',' + (210 + s[3]*45|0) + ',255,' + (0.25 + s[3]*0.5) + ')'; c.fillRect(s[0]*w, s[1]*h, 1 + s[2]*1.4, 1 + s[2]*1.4); }
    var rot = (t||0)*0.00004 + st.yaw, cy = Math.cos(rot), sy = Math.sin(rot), cp = Math.cos(st.pitch), sp = Math.sin(st.pitch), S = Math.min(w, h)*0.44*st.zoom, cx = w*0.5, cz = h*0.54;
    var core = c.createRadialGradient(cx, cz, 0, cx, cz, S*0.35); core.addColorStop(0, 'rgba(255,225,170,0.55)'); core.addColorStop(1, 'rgba(255,200,140,0)'); c.fillStyle = core; c.fillRect(cx - S*0.4, cz - S*0.4, S*0.8, S*0.8);
    var cols = ['255,170,120', '170,200,255', '255,240,215'];
    for (var p = 0; p < st.stars.length; p++){ var q = st.stars[p]; var x0 = q[0]*cy - q[1]*sy, y0 = q[0]*sy + q[1]*cy; var X = cx + x0*S, Y = cz + (y0*cp - q[2]*sp)*S; c.fillStyle = 'rgba(' + cols[q[4]] + ',' + (0.35*q[3]) + ')'; c.fillRect(X, Y, 1.6, 1.6); }
    c.globalCompositeOperation = 'source-over';
  }
})();

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { Pass } from 'three/addons/postprocessing/Pass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';

/* ═══════════════════════ CONSTANTS & MATH ═══════════════════════ */
const TAU = Math.PI*2, PI = Math.PI, DEG = PI/180;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a)*t;
const sstep = (a, b, x) => { const t = clamp((x - a)/(b - a), 0, 1); return t*t*(3 - 2*t); };
const angDiff = (a, b) => { let d = (a - b) % TAU; if (d > PI) d -= TAU; if (d < -PI) d += TAU; return d; };
const AU = 150;                          // scene units per astronomical unit
const LYU = 63241.077*AU;                // scene units per light-year
const SUN_R = 28, EQ_KM = 6378.137, EARTH_R = 1.4;
const rDisp = km => km/EQ_KM*EARTH_R;    // planetary radii share one scale; distances use another (visualisation scaling)
const JD_J2000 = 2451545.0, JD_UNIX = 2440587.5;
const GM_SUN = 2.9591220828e-4, AU_KM = 149597870.7, KMS_PER_AUD = AU_KM/86400;
const OBL = 23.4392911*DEG;
const MOON_DIST = 7.0;
const Y_AXIS = new THREE.Vector3(0, 1, 0);
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0)/4294967296; }; }
function gaussFn(R){ return () => { let u = 0; while (u === 0) u = R(); return Math.sqrt(-2*Math.log(u))*Math.cos(TAU*R()); }; }

/* ═══════════════════════ RENDERER & QUALITY TIER ═══════════════════════ */
const QS = new URLSearchParams(location.search);
const isTouch = (window.matchMedia && matchMedia('(pointer:coarse)').matches) || /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
const canvas = document.getElementById('gl');
const veil = document.getElementById('veil');
const SAFE = QS.has('safe');
let NOCOMP = SAFE;
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias:false, logarithmicDepthBuffer:true, powerPreference:'high-performance', stencil:false, alpha:false });
} catch(err){ if (window.__cosmosFail) window.__cosmosFail(err); throw err; }
let TIER = isTouch ? 1 : 2;
{
  const gl = renderer.getContext();
  const ext = gl.getExtension('WEBGL_debug_renderer_info');
  const gpu = ext ? String(gl.getParameter(ext.UNMASKED_RENDERER_WEBGL)) : '';
  if (/SwiftShader|llvmpipe|softpipe|Software|Mali-[GT]?[2-7]\d|Adreno \(TM\) [3-5]\d\d|PowerVR|Intel\(R\) (HD|UHD) Graphics/i.test(gpu)) TIER = Math.max(0, TIER - 1);
  if (renderer.capabilities.maxTextureSize < 8192) TIER = Math.min(TIER, 1);
  if (!renderer.capabilities.isWebGL2){ if (window.__cosmosFail) window.__cosmosFail(new Error('webgl2')); throw new Error('WebGL2 required'); }
}
if (QS.has('q')) TIER = clamp(parseInt(QS.get('q'), 10) || 0, 0, 2);
if (SAFE) TIER = 0;
const QT = [
  { gal:150000, dust:6000,  hii:900,  sky:14000, cat:'6', local:14000, belt:3000,  troj:900,  kuiper:5000,  mc:7000,  deep:1200, far:9000,  web:5000,  dpr:1.0, seg:64,  pano:[2048,1024], field:[1024,512],  bloom:0.62, neb:14, bhSteps:70,  detail:60000,  clouds:'1024' },
  { gal:300000, dust:11000, hii:1600, sky:24000, cat:'6', local:30000, belt:6000,  troj:1600, kuiper:10000, mc:13000, deep:2000, far:22000, web:9000,  dpr:1.5, seg:96,  pano:[2048,1024], field:[2048,1024], bloom:0.64, neb:22, bhSteps:110, detail:110000, clouds:'1024' },
  { gal:640000, dust:22000, hii:2800, sky:42000, cat:'8', local:70000, belt:12000, troj:3200, kuiper:22000, mc:26000, deep:3200, far:48000, web:16000, dpr:2.0, seg:160, pano:[3072,1536], field:[2048,1024], bloom:0.66, neb:34, bhSteps:150, detail:200000, clouds:'2048' }
];
const Q = QT[TIER];
let DPR = Math.min(window.devicePixelRatio || 1, Q.dpr);
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth, innerHeight, false);
renderer.setClearColor(0x000000, 1);
renderer.autoClear = false;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const MAX_ANISO = Math.min(8, renderer.capabilities.getMaxAnisotropy());
canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); }, false);
canvas.addEventListener('webglcontextrestored', () => location.reload(), false);

/* Two render layers share one camera path: a galactic/cosmic layer in light-years and a Solar-System layer in scene units. */
const scene = new THREE.Scene();
const galScene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(46, innerWidth/innerHeight, 1e-3, 1e13);
const galCam = new THREE.PerspectiveCamera(46, innerWidth/innerHeight, 1e-5, 6e11);
let solarVisible = true, starNearFlag = false;

function renderLayers(target){
  renderer.setRenderTarget(target);
  renderer.clear(true, true, false);
  renderer.render(galScene, galCam);
  if (solarVisible){ renderer.clearDepth(); renderer.render(scene, camera); }
}
class LayerPass extends Pass {
  constructor(){ super(); this.needsSwap = false; }
  render(r, writeBuffer, readBuffer){ renderLayers(this.renderToScreen ? null : readBuffer); }
}
const PASS_VERT = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position, 1.0); }`;
/* NaN / Inf guard: any invalid HDR value is zeroed and everything is clamped before bloom can smear it into black squares. */
const SanitizeShader = {
  uniforms:{ tDiffuse:{ value:null } }, vertexShader:PASS_VERT,
  fragmentShader:`uniform sampler2D tDiffuse; varying vec2 vUv;
    void main(){
      vec4 c = texture2D(tDiffuse, vUv);
      vec3 x = c.rgb;
      x.r = (x.r >= 0.0) ? min(x.r, 7.0) : 0.0;
      x.g = (x.g >= 0.0) ? min(x.g, 7.0) : 0.0;
      x.b = (x.b >= 0.0) ? min(x.b, 7.0) : 0.0;
      gl_FragColor = vec4(x, 1.0);
    }`
};
const GradeShader = {
  uniforms:{ tDiffuse:{value:null}, uTime:{value:0}, uAspect:{value:1} }, vertexShader:PASS_VERT,
  fragmentShader:`uniform sampler2D tDiffuse; uniform float uTime, uAspect; varying vec2 vUv;
    float h12(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y)*p3.z); }
    void main(){
      vec4 c = texture2D(tDiffuse, vUv);
      vec2 q = vUv - 0.5; q.x *= uAspect;
      float vig = smoothstep(0.38, 1.08, length(q));
      vec3 col = c.rgb*(1.0 - 0.20*vig);
      float l = dot(col, vec3(0.2126, 0.7152, 0.0722));
      col = mix(col, col*vec3(0.965, 1.0, 1.05), (1.0 - smoothstep(0.0, 0.32, l))*0.55);
      col = mix(col, col*vec3(1.03, 1.0, 0.965), smoothstep(0.45, 1.0, l)*0.45);
      vec3 floorC = mix(vec3(0.011, 0.013, 0.026), vec3(0.022, 0.012, 0.024), vUv.y)*(1.0 - 0.55*vig);
      col = max(col, floorC);
      float n = h12(gl_FragCoord.xy + fract(uTime*7.13)*391.0) + h12(gl_FragCoord.yx*1.37 + fract(uTime*3.7)*113.0) - 1.0;
      col += n*(1.25/255.0);
      gl_FragColor = vec4(col, 1.0);
    }`
};
const composerRT = new THREE.WebGLRenderTarget(8, 8, { type:THREE.HalfFloatType });
const composer = new EffectComposer(renderer, composerRT);
composer.setPixelRatio(DPR);
composer.setSize(innerWidth, innerHeight);
const sanitizePass = new ShaderPass(SanitizeShader);
const bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), Q.bloom*0.85, 0.72, 0.9);
const gradePass = new ShaderPass(GradeShader);
let smaaPass = null;
function buildPipeline(bhPass){
  composer.addPass(new LayerPass());
  composer.addPass(sanitizePass);
  if (bhPass) composer.addPass(bhPass);
  composer.addPass(bloomPass);
  composer.addPass(new OutputPass());
  if (TIER >= 1){ smaaPass = new SMAAPass(innerWidth*DPR, innerHeight*DPR); composer.addPass(smaaPass); }
  composer.addPass(gradePass);
}

/* ═══════════════════════ ASTRONOMY ═══════════════════════ */
const ELEMENTS = {  // JPL approximate Keplerian elements, J2000 + rates per century
  mercury:{a:[0.38709927,0.00000037],e:[0.20563593,0.00001906],I:[7.00497902,-0.00594749],L:[252.25032350,149472.67411175],w:[77.45779628,0.16047689],O:[48.33076593,-0.12534081]},

function makeLocalStarMat(){
  return new THREE.ShaderMaterial({
    transparent:true, blending:THREE.AdditiveBlending, depthWrite:false, depthTest:false,
    uniforms:{ uPR:{value:DPR}, uVis:{value:1}, uLim:{value:6.2}, uGain:{value:1} },
    vertexShader:`attribute float aAbs; attribute vec3 aCol; uniform float uPR, uVis, uLim, uGain;
      varying vec3 vC; varying float vS; varying float vSig; varying float vHalo;
      void main(){
        vec4 mv = modelViewMatrix*vec4(position, 1.0);
        float dly = max(length(mv.xyz), 1e-8);
        float m = aAbs + 5.0*log(dly/32.6156)/2.302585;
        float f = exp2(-1.3287712*(m - uLim));
        float vis = uVis*smoothstep(0.05, 0.8, f);
        if (vis < 0.003){ gl_Position = vec4(2.0, 2.0, 2.0, 1.0); gl_PointSize = 0.0; vC = vec3(0.0); vS = 1.0; vSig = 1.0; vHalo = 0.0; return; }
        float L = log(1.0 + f);
        vSig = (0.55 + 0.11*min(L, 7.0))*uPR;
        vHalo = clamp(L*0.15, 0.0, 1.0);
        vS = min((3.5 + 2.6*pow(L, 0.9))*uPR, 34.0*uPR);
        vC = aCol*min(0.30 + 0.30*L, 3.2)*vis*uGain;
        gl_PointSize = vS;
        gl_Position = projectionMatrix*mv;
      }`,
    fragmentShader:`varying vec3 vC; varying float vS; varying float vSig; varying float vHalo;
      void main(){
        float r = length(gl_PointCoord - 0.5)*vS;
        float core = exp(-r*r/(2.0*vSig*vSig));
        float halo = exp(-r/(vSig*2.4))*0.06*vHalo;
        float edge = 1.0 - smoothstep(vS*0.38, vS*0.5, r);

function buildMagellanic(){

  const basis = (ctr, tilt) => {
    const los = ctr.clone().normalize();
    const a = new THREE.Vector3().crossVectors(los, GAL_POLE).normalize();
    const b = new THREE.Vector3().crossVectors(a, los).normalize();
    const nrm = los.clone().multiplyScalar(Math.cos(tilt)).addScaledVector(b, Math.sin(tilt)).normalize();
    const u = new THREE.Vector3().crossVectors(nrm, a).normalize();
    const v = new THREE.Vector3().crossVectors(nrm, u).normalize();
    return { u, v, nrm };
  };
  const v = new THREE.Vector3();
  const lmc = poleVector(80.89, -69.76).multiplyScalar(163000), L = basis(lmc, 35*DEG);
  const tar = lmc.clone().addScaledVector(L.u, 2400).addScaledVector(L.v, 1700);
  const nL = N*0.68 | 0;
  for (let k = 0; k < nL; k++){
    const q = R();
    if (q < 0.30){ const a = G()*3300, b = G()*850; v.copy(lmc).addScaledVector(L.u, a).addScaledVector(L.v, b).addScaledVector(L.nrm, G()*450); const t = 0.8 + 0.4*R(); put(v, [1.0*t, 0.88*t, 0.74*t], 120 + R()*90); }
    else if (q < 0.93){ const r = 3600*(-Math.log(R()*R() + 1e-12)), th = R()*TAU; if (r > 22000) { k--; continue; }
      v.copy(lmc).addScaledVector(L.u, r*Math.cos(th)).addScaledVector(L.v, r*Math.sin(th)).addScaledVector(L.nrm, G()*500);
      const young = R() < 0.45, t = young ? 0.8 + 0.6*R() : 0.45 + 0.3*R();
      put(v, young ? [0.66*t, 0.78*t, 1.0*t] : [1.0*t, 0.9*t, 0.78*t], 90 + R()*110); }
    else { v.copy(tar).addScaledVector(L.u, G()*420).addScaledVector(L.v, G()*420).addScaledVector(L.nrm, G()*200); const t = 1.2 + R(); put(v, [1.0*t, 0.36*t, 0.46*t], 80 + R()*120); }
  }

}

function buildDeepSky(){

/* Texture loading — never fatal: every map has a procedural fallback */
const texLoader = new THREE.TextureLoader();
texLoader.setCrossOrigin('anonymous');
function loadTex(urls, srgb, onLoad){
  let i = 0;
  const next = () => {
    if (i >= urls.length) return;
    texLoader.load(urls[i++], t => { t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace; t.anisotropy = MAX_ANISO; onLoad(t); }, undefined, next);
  };
  next();
}
function attachMaps(mat, def, extraMat){
  if (!def.maps) return;
  for (const key of Object.keys(def.maps)){
    const urls = def.maps[key];
    if (!urls || !urls.length) continue;
    const isColor = key === 'map' || key === 'emissiveMap';
    loadTex(urls, isColor, tex => {
      const old = mat[key];
      mat[key] = tex;
      mat.userData.remote = mat.userData.remote || {};
      mat.userData.remote[key] = true;
      if (key === 'map'){ mat.color.set(def.tint || 0xffffff); if (extraMat){ extraMat.map = tex; extraMat.needsUpdate = true; } }
      if (key === 'bumpMap') mat.bumpScale = def.bumpScale || 0.01;
      if (key === 'normalMap') mat.normalScale.set(0.9, 0.9);
      if (key === 'emissiveMap'){ mat.emissive.set(0xffd0a0); mat.emissiveIntensity = 1.7; }
      mat.needsUpdate = true;
      if (old && old !== tex && old.dispose && !(old.userData && old.userData.shared)) old.dispose();
    });
  }
}
function scheduleProcedural(mat, kind, seed, base, extraMat){
  jobs.push(() => {
    if (mat.userData.remote && mat.userData.remote.map) return;
    mat.map = kind === 'venus' ? makeVenusTexture() : makeProceduralTex(kind, seed, base);
    mat.color.set(0xffffff); mat.needsUpdate = true;
    if (extraMat){ extraMat.map = mat.map; extraMat.needsUpdate = true; }
  });
}
function loadCloudTexture(urls, apply){
  let i = 0;
  const next = () => {
    if (i >= urls.length) return;
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      try {
        const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
        const x = c.getContext('2d'); x.drawImage(img, 0, 0);
        const d = x.getImageData(0, 0, c.width, c.height), p = d.data;
        for (let k = 0; k < p.length; k += 4){
          const lum = (p[k]*0.30 + p[k+1]*0.59 + p[k+2]*0.11)/255;
          const al = Math.min(1, (p[k+3]/255)*lum*1.25);
          p[k] = p[k+1] = p[k+2] = 255; p[k+3] = al*255;
        }
        x.putImageData(d, 0, 0);
        const t = canvasTexture(c, true); t.anisotropy = MAX_ANISO; t.wrapS = THREE.RepeatWrapping;
        apply(t);
      } catch(e){ next(); }
    };
    img.onerror = next;
    img.src = urls[i++];
  };
  next();
}

/* Atmosphere shell (analytic limb scattering with sunset tint) */
function makeAtmosphere(atm, flat, R, pole){
  const Rs = R*(1 + atm.thick), k = 1/(1 - (flat || 0));
  const mat = new THREE.ShaderMaterial({
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, side:THREE.FrontSide,
    uniforms:{ uR:{value:R}, uRs:{value:Rs}, uK:{value:k}, uAxis:{value:pole.clone()},
      uColor:{value:new THREE.Color(...atm.color)}, uSunset:{value:new THREE.Color(...atm.sunset)},
      uStrength:{value:atm.strength}, uDisc:{value:atm.disc}, uFall:{value:atm.fall} },
    vertexShader:`#include <common>
      #include <logdepthbuf_pars_vertex>
      varying vec3 vW; varying vec3 vC;
      void main(){ vec4 wp = modelMatrix*vec4(position, 1.0); vW = wp.xyz; vC = (modelMatrix*vec4(0.0, 0.0, 0.0, 1.0)).xyz;
        gl_Position = projectionMatrix*viewMatrix*wp;
        #include <logdepthbuf_vertex>
      }`,
    fragmentShader:`#include <logdepthbuf_pars_fragment>
      uniform float uR, uRs, uK, uStrength, uDisc, uFall; uniform vec3 uAxis, uColor, uSunset;
      varying vec3 vW; varying vec3 vC;
      vec3 sq(vec3 v){ return v + uAxis*(dot(v, uAxis)*(uK - 1.0)); }
      void main(){
        #include <logdepthbuf_fragment>
        vec3 rd = normalize(sq(normalize(vW - cameraPosition)));
        vec3 ro = sq(cameraPosition - vC);
        float t = -dot(ro, rd);
        vec3 q = ro + rd*t;
        float b = length(q);
        float glow; vec3 n;
        if (b < uR){ float h = sqrt(max(uR*uR - b*b, 0.0)); glow = pow(max(1.0 - h/uR, 0.0), uDisc); n = normalize(q - rd*h); }
        else { float hh = (b - uR)/(uRs - uR); if (hh >= 1.0) discard; glow = pow(max(1.0 - hh, 0.0), uFall); n = normalize(q); }
        vec3 sunDir = normalize(-vC);
        float sd = dot(n, sunDir);
        float lit = smoothstep(-0.22, 0.38, sd);
        float s2 = sd/0.22;
        vec3 col = mix(uColor, uSunset, exp(-s2*s2)*0.75);
        gl_FragColor = vec4(col*glow*lit*uStrength, 1.0);
      }`
  });
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(Rs, Q.seg/1.6 | 0, Q.seg/2 | 0), mat);
  mesh.scale.y = 1 - (flat || 0);
  mesh.renderOrder = 5;
  return mesh;
}

/* Rings: translucent, gap-resolved, lit with the planet's shadow and forward scattering */
function makeRing(kind, R, pole){
  const { tex, r0, r1 } = makeRingTexture(kind);
  const mat = new THREE.ShaderMaterial({
    transparent:true, depthWrite:false, side:THREE.DoubleSide,
    uniforms:{ uTex:{value:tex}, uIn:{value:r0*R}, uOut:{value:r1*R}, uSph:{value:new THREE.Vector4(0, 0, 0, R*0.97)}, uN:{value:pole.clone()}, uBright:{value:kind === 'saturn' ? 1.6 : 0.42} },
    vertexShader:`#include <common>
      #include <logdepthbuf_pars_vertex>
      varying vec3 vW; varying vec2 vL;
      void main(){ vL = position.xy; vec4 wp = modelMatrix*vec4(position, 1.0); vW = wp.xyz; gl_Position = projectionMatrix*viewMatrix*wp;
        #include <logdepthbuf_vertex>
      }`,
    fragmentShader:`#include <logdepthbuf_pars_fragment>
      uniform sampler2D uTex; uniform float uIn, uOut, uBright; uniform vec4 uSph; uniform vec3 uN;
      varying vec3 vW; varying vec2 vL;
      void main(){
        #include <logdepthbuf_fragment>
        float u = (length(vL) - uIn)/(uOut - uIn);
        vec4 t = texture2D(uTex, vec2(u, 0.5));
        if (t.a < 0.004) discard;
        vec3 L = normalize(-vW), V = normalize(cameraPosition - vW);
        float nl = dot(uN, L), nv = dot(uN, V);
        float lit = smoothstep(0.0, 0.30, abs(nl));
        float sh = 1.0;
        { vec3 oc = uSph.xyz - vW; float tt = dot(oc, L);
          if (tt > 0.0){ float d = length(oc - L*tt); float pen = tt*0.00465*150.0/max(length(vW), 30.0); sh = smoothstep(uSph.w - pen, uSph.w + pen, d); } }
        float scat = (nl*nv > 0.0) ? 1.0 : mix(0.22, 0.72, t.a);
        float fwd = pow(max(dot(-V, L), 0.0), 8.0)*(1.0 - t.a)*1.5;
        vec3 col = t.rgb*uBright*(lit*sh*(scat + fwd) + 0.015);
        gl_FragColor = vec4(col, t.a);
      }`
  });
  const mesh = new THREE.Mesh(new THREE.RingGeometry(r0*R, r1*R, 256, 1), mat);
  mesh.rotation.x = -PI/2;
  mesh.renderOrder = 4;
  return { mesh, mat, tex, inner:r0*R, outer:r1*R };
}

let dragMode = null, lastX = 0, lastY = 0, pinchDist = 0, pinchAng = 0, pinchMid = null, downX = 0, downY = 0, downT = 0, moved = false;
const ROT = 0.0055;
function panDelta(dx, dy){
  const D = camera.position.distanceTo(_E);
  const scale = 2*D*Math.tan(camera.fov*DEG/2)/innerHeight;
  _a.setFromMatrixColumn(camera.matrixWorld, 0).multiplyScalar(-dx*scale);
  _b.setFromMatrixColumn(camera.matrixWorld, 1).multiplyScalar(dy*scale);
  return _a.add(_b);
}
function interrupt(){
  if (ctl.flight){
    const F = ctl.flight; ctl.flight = null;
    const b = F.spec.body;
    if (b){ ctl.focus = b; b.getPos(_c); ctl.glide.subVectors(ctl.anchor, _c); ctl.offset.set(0, 0, 0); }
  }

}
canvas.addEventListener('pointerdown', e => {
  canvas.focus({ preventScroll:true });
  try { canvas.setPointerCapture(e.pointerId); } catch(_){}
  pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
  interrupt();
  if (pointers.size === 1){
    dragMode = (e.button === 2 || e.button === 1 || e.shiftKey || e.ctrlKey || e.metaKey) ? 'pan' : 'rot';
    lastX = e.clientX; lastY = e.clientY; downX = e.clientX; downY = e.clientY; downT = performance.now(); moved = false;
  } else if (pointers.size === 2){
    const [p1, p2] = [...pointers.values()];
    dragMode = 'pinch'; pinchDist = Math.hypot(p2.x - p1.x, p2.y - p1.y); pinchAng = Math.atan2(p2.y - p1.y, p2.x - p1.x);
    pinchMid = { x:(p1.x + p2.x)/2, y:(p1.y + p2.y)/2 }; moved = true;
  }
  canvas.classList.add('drag');
});
canvas.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)){ hoverTest(e.clientX, e.clientY); return; }
  pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (dragMode === 'pinch' && pointers.size >= 2){
    const [p1, p2] = [...pointers.values()];
    const d = Math.max(1, Math.hypot(p2.x - p1.x, p2.y - p1.y)), ang = Math.atan2(p2.y - p1.y, p2.x - p1.x);
    const mid = { x:(p1.x + p2.x)/2, y:(p1.y + p2.y)/2 };
    ctl.vLog += -Math.log(d/pinchDist)*1.15*DAMP;
    ctl.vYaw += -angDiff(ang, pinchAng)*DAMP;
    ctl.vPan.addScaledVector(panDelta(mid.x - pinchMid.x, mid.y - pinchMid.y), DAMP);
    pinchDist = d; pinchAng = ang; pinchMid = mid;
    return;
  }
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  if (Math.hypot(e.clientX - downX, e.clientY - downY) > 5) moved = true;
  if (dragMode === 'rot'){ ctl.vYaw += -dx*ROT*DAMP; ctl.vPitch += dy*ROT*DAMP; }
  else if (dragMode === 'pan'){ ctl.vPan.addScaledVector(panDelta(dx, dy), DAMP); }
});
function endPointer(e){
  const wasClick = pointers.size === 1 && dragMode !== 'pinch' && !moved && performance.now() - downT < 550 && e.type === 'pointerup' && e.button === 0;
  pointers.delete(e.pointerId);
  if (pointers.size === 1){ const p = [...pointers.values()][0]; lastX = p.x; lastY = p.y; dragMode = 'rot'; }
  if (pointers.size === 0){ dragMode = null; canvas.classList.remove('drag'); }
  if (wasClick){ const hit = pickAt(e.clientX, e.clientY); if (hit) selectHit(hit, 1); }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('wheel', e => {
  e.preventDefault(); interrupt();
  let dy = e.deltaY;
  if (e.deltaMode === 1) dy *= 33; else if (e.deltaMode === 2) dy *= 800;
  const k = (e.shiftKey ? 3 : 1)*(e.ctrlKey ? 2.2 : 1);
  ctl.vLog += clamp(dy, -400, 400)*0.0021*k*DAMP;
}, { passive:false });
canvas.addEventListener('dblclick', e => {
  const hit = pickAt(e.clientX, e.clientY);
  if (hit) selectHit(hit, 0.45);
  else if (ctl.focus) flyToBody(ctl.focus, 0.5);
  else ctl.vLog -= 1.0*DAMP;
});
let lastTap = 0, lastTapX = 0, lastTapY = 0;
canvas.addEventListener('touchend', e => {
  if (e.changedTouches.length !== 1 || e.touches.length) return;
  const t = e.changedTouches[0], now = performance.now();
  if (now - lastTap < 320 && Math.hypot(t.clientX - lastTapX, t.clientY - lastTapY) < 30){
    const hit = pickAt(t.clientX, t.clientY);
    if (hit) selectHit(hit, 0.45); else if (ctl.focus) flyToBody(ctl.focus, 0.5); else ctl.vLog -= 1.0*DAMP;
    e.preventDefault(); lastTap = 0; return;
  }
  lastTap = now; lastTapX = t.clientX; lastTapY = t.clientY;
}, { passive:false });

/* Screen-space picking (bodies, plus the Sun's position at interstellar and galactic scales) */
function pickSolar(x, y){
  const w = innerWidth, h = innerHeight, tanH = Math.tan(camera.fov*DEG/2);
  let best = null, bd = 1e9;
  const D = camera.position.length();
  if (D < 2e7){
    for (const b of bodies){
      if (b.isMoon){ b.parent.getPos(_c); if (camera.position.distanceTo(_c) > b.parent.R*(b.parent === earth ? 900 : 420)) continue; }
      b.getPos(_a);
      _c.copy(_a).applyMatrix4(camera.matrixWorldInverse);
      if (_c.z >= -1e-4) continue;
      const dist = Math.max(1e-6, camera.position.distanceTo(_a));
      const sr = b.R/(dist*tanH)*(h/2);
      _b.copy(_a).project(camera);
      const sx = (_b.x*0.5 + 0.5)*w, sy = (-_b.y*0.5 + 0.5)*h;
      const d = Math.hypot(sx - x, sy - y), rad = Math.max(b.isMoon ? 14 : 22, sr + 8);
      if (d < rad && d - sr*0.5 < bd){ bd = d - sr*0.5; best = { body:b }; }
    }
  }
  if (!best && D > 5e4){
    _a.set(0, 0, 0).project(camera);
    _c.set(0, 0, 0).applyMatrix4(camera.matrixWorldInverse);
    if (_c.z < 0){ const sx = (_a.x*0.5 + 0.5)*w, sy = (-_a.y*0.5 + 0.5)*h; if (Math.hypot(sx - x, sy - y) < 34) best = { home:true }; }
  }
  return best;
}
function selectHit(hit, zoom){
  if (hit.home){ VIEW.solar(); return; }
  const t = hit.body || hit.t;
  if (t === sunBody && zoom === 1 && Math.exp(ctl.logD) > 4000){ VIEW.solar(); return; }
  if (t.isMilkyWay){ VIEW.galaxy(); return; }
  flyToBody(t, zoom === 1 ? 1 : zoom);
}
let hoverAt = 0;
function hoverTest(x, y){
  const now = performance.now(); if (now - hoverAt < 70) return; hoverAt = now;
  showDock();
  canvas.classList.toggle('hot', !!pickAt(x, y));
}

/* Keyboard */
const KEY_BODIES = ['sun', 'mercury', 'venus', 'earth', 'mars', 'jupiter', 'saturn', 'uranus', 'neptune', 'pluto'];
addEventListener('keydown', e => {
  if (e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  const handled = () => { e.preventDefault(); showDock(); };
  if (k === ' '){ handled(); playing = !playing; dock.classList.toggle('paused', !playing); }
  else if (k === 'escape'){ handled(); interrupt(); goWider(); }
  else if (k === 'g'){ handled(); interrupt(); VIEW.galaxy(); }
  else if (k === 'u'){ handled(); interrupt(); VIEW.universe(); }
  else if (k === 'l'){ handled(); interrupt(); VIEW.local(); }
  else if (k === 'j'){ handled(); interrupt(); nextBlackHole(); }
  else if (k === 'x'){ handled(); interrupt(); flyToStarman(); }
  else if (k === 'p'){ handled(); interrupt(); randomStar(); }
  else if (k === 'q'){ handled(); interrupt(); randomGalaxy(); }
  else if (k === 'h' || k === 'home'){ handled(); interrupt(); VIEW.solar(); }
  else if (k === 'f'){ handled(); interrupt(); VIEW.outer(); }
  else if (k === 'n'){ handled(); interrupt(); VIEW.neighborhood(); }
  else if (k === 'o'){ handled(); orbitGroup.visible = !orbitGroup.visible; moonOrbit.line.visible = orbitGroup.visible; }
  else if (k === 'b'){ handled(); belt.visible = trojans.visible = !belt.visible; }
  else if (k === 'k'){ handled(); kuiper.visible = !kuiper.visible; }
  else if (k === 'r'){ handled(); direction *= -1; showRate(); }
  else if (k === 't'){ handled(); simDays = nowDays(); manualRate = false; direction = 1; playing = true; dock.classList.remove('paused'); }
  else if (k === ']' || k === '+' || k === '='){ handled(); changeSpeed(1); }
  else if (k === '[' || k === '-'){ handled(); changeSpeed(-1); }
  else if (k === 'm'){ handled(); interrupt(); flyToBody(moonBody); }
  else if (k === 'c'){ handled(); interrupt(); cycleMoon(); }
  else if (/^[0-9]$/.test(k)){ handled(); interrupt(); flyToBody(byId[KEY_BODIES[+k]]); }
  else if (k === 'arrowleft'){ handled(); interrupt(); ctl.vYaw += 0.12*DAMP; }
  else if (k === 'arrowright'){ handled(); interrupt(); ctl.vYaw -= 0.12*DAMP; }
  else if (k === 'arrowup'){ handled(); interrupt(); ctl.vPitch -= 0.08*DAMP; }
  else if (k === 'arrowdown'){ handled(); interrupt(); ctl.vPitch += 0.08*DAMP; }
  else if (k === 'pageup' || k === 'w'){ handled(); interrupt(); ctl.vLog -= 0.45*DAMP; }
  else if (k === 'pagedown' || k === 's'){ handled(); interrupt(); ctl.vLog += 0.45*DAMP; }
});
function cycleMoon(){
  let host = ctl.focus ? (ctl.focus.isMoon ? ctl.focus.parent : ctl.focus) : null;
  if (!host || !host.moons || !host.moons.length) host = byId.jupiter;
  const list = host.moons, i = ctl.focus && ctl.focus.isMoon ? list.indexOf(ctl.focus) : -1;
  flyToBody(list[(i + 1) % list.length]);
}
function changeSpeed(d){
  if (!manualRate){ manualRate = true; speedIdx = SPEEDS.reduce((bi, s, i) => Math.abs(Math.log(s/simRate)) < Math.abs(Math.log(SPEEDS[bi]/simRate)) ? i : bi, 0); }
  speedIdx = clamp(speedIdx + d, 0, SPEEDS.length - 1);
  playing = true; dock.classList.remove('paused');
  showRate();
}

/* Icon-only dock (auto-hiding) and wordless time-rate indicator */
const dock = document.getElementById('dock'), rateEl = document.getElementById('rate');
rateEl.innerHTML = '<b></b>' + SPEEDS.map(() => '<i></i>').join('');
let dockTimer = null, rateTimer = null, dockHover = false;
function showDock(){
  dock.classList.add('show');
  clearTimeout(dockTimer);
  dockTimer = setTimeout(() => { if (!dockHover) dock.classList.remove('show'); }, isTouch ? 3600 : 2600);
}
dock.addEventListener('pointerenter', () => { dockHover = true; showDock(); });
dock.addEventListener('pointerleave', () => { dockHover = false; showDock(); });
dock.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const a = b.dataset.a; interrupt();
  if (a === 'out') goWider();
  else if (a === 'galaxy') VIEW.galaxy();
  else if (a === 'home') VIEW.solar();
  else if (a === 'universe') VIEW.universe();
  else if (a === 'bh') nextBlackHole();
  else if (a === 'car') flyToStarman();
  else if (a === 'slower') changeSpeed(-1);
  else if (a === 'faster') changeSpeed(1);
  else if (a === 'play'){ playing = !playing; dock.classList.toggle('paused', !playing); }
  showDock();
});
function showRate(){
  const dots = rateEl.querySelectorAll('i');
  const idx = manualRate ? speedIdx : SPEEDS.reduce((bi, s, i) => Math.abs(Math.log(s/simRate)) < Math.abs(Math.log(SPEEDS[bi]/simRate)) ? i : bi, 0);
  dots.forEach((d, i) => d.classList.toggle('on', i <= idx));
  rateEl.querySelector('b').className = direction > 0 ? 'fw' : 'rv';
  rateEl.classList.add('show');
  clearTimeout(rateTimer);
  rateTimer = setTimeout(() => rateEl.classList.remove('show'), 1700);
}
addEventListener('touchstart', () => showDock(), { passive:true });

/* ═══════════════════════ RESIZE & ADAPTIVE QUALITY ═══════════════════════ */
function applySize(){
  const w = innerWidth, h = innerHeight;
  camera.aspect = galCam.aspect = w/h;
  camera.updateProjectionMatrix(); galCam.updateProjectionMatrix();
  renderer.setPixelRatio(DPR); renderer.setSize(w, h, false);
  composer.setPixelRatio(DPR); composer.setSize(w, h);
  gradePass.uniforms.uAspect.value = w/h;
  if (smaaPass) smaaPass.setSize(w*DPR, h*DPR);
  for (const m of [skyStarMat, localStarMat, sunStarMat, homeMat, dots.material, belt.material, trojans.material, kuiper.material, galParts.deepMat])
    if (m && m.uniforms.uPR) m.uniforms.uPR.value = DPR;
}
addEventListener('resize', applySize);
let adaptAcc = 0, adaptN = 0, dprLevel = 0;
function adapt(dt){
  adaptAcc += dt; adaptN++;
  if (adaptN < 90) return;
  const avg = adaptAcc/adaptN; adaptAcc = 0; adaptN = 0;
  if (avg > 0.034 && dprLevel < 3){ dprLevel++; DPR = Math.max(0.6, Math.min(window.devicePixelRatio || 1, Q.dpr)*(1 - dprLevel*0.22)); applySize(); }
  else if (avg > 0.05 && bloomPass.enabled && dprLevel >= 3){ bloomPass.enabled = false; }
}

/* ═══════════════════════ FRAME UPDATE ═══════════════════════ */
function updateLayers(realT){
  const dSun = camera.position.length(), dly = dSun/LYU;
  galCam.position.copy(camera.position).divideScalar(LYU);
  galCam.quaternion.copy(camera.quaternion);
  galCam.updateMatrixWorld();
  panoMesh.position.copy(galCam.position);
  skyGroup.position.copy(galCam.position);
  deepGroup.position.copy(galCam.position);
  const panoVis = 1 - sstep(450, 4200, dly);
  const modelVis = sstep(350, 4000, dly);
  const neighVis = 1 - sstep(20000, 60000, dly);
  panoUniforms.uVis.value = panoVis; panoMesh.visible = panoVis > 0.002;
  skyStarMat.uniforms.uVis.value = panoVis; skyGroup.visible = panoVis > 0.002;
  localStarMat.uniforms.uVis.value = neighVis; neighGroup.visible = neighVis > 0.002;
  sunStarMat.uniforms.uVis.value = sstep(1.2e4, 9e4, dSun);
  homeMat.uniforms.uVis.value = sstep(4, 60, dly)*0.42;
  homeMat.uniforms.uTime.value = realT;
  galUniforms.uScale.value = renderer.domElement.height/(2*Math.tan(galCam.fov*DEG/2));
  galUniforms.uRot.value = realT*2.2e-5;
  galGroup.visible = modelVis > 0.002;
  if (galParts.stars){
    galParts.stars.material.uniforms.uVis.value = modelVis;
    galParts.dust.material.uniforms.uVis.value = modelVis;
    galParts.hii.material.uniforms.uVis.value = modelVis;
    const gcFade = sstep(150, 5200, camera.position.distanceTo(GC_SCENE)/LYU);
    galParts.bulge.material.opacity = 0.30*modelVis*gcFade;
    for (const p of galPlanes) p.material.uniforms.uVis.value = modelVis*gcFade;
  }
  updateNebulae(dly);
  updateGlobulars();
  starNearFlag = updateStarObject();
  solarVisible = dSun < 4e7 || starNearFlag || !!(roadster && roadster.holder.visible && false);
  const beltFade = 1 - sstep(9e3, 7e4, dSun), kuiperFade = 1 - sstep(4e4, 3e5, dSun);
  belt.material.uniforms.uFade.value = beltFade; trojans.material.uniforms.uFade.value = beltFade;
  kuiper.material.uniforms.uFade.value = kuiperFade;
  const Dt = Math.exp(ctl.logD);
  const orbitFade = (1 - sstep(1.5e5, 2e6, dSun))*(0.3 + 0.7*sstep(10, 90, Dt));
  moonOrbit.line.material.opacity = 0.14*(0.35 + 0.65*sstep(3, 14, Dt));
  for (const id in orbitLines){
    const l = orbitLines[id], f = ctl.focus && (ctl.focus.id === id) ? 1.9*sstep(18, 140, Dt) : 1;
    l.material.opacity = l.userData.base*orbitFade*f;
  }
  coronaMesh.quaternion.copy(camera.quaternion);
  updateCosmos(dly, realT);
  updateBlackHoles(realT);
}
function updateDots(){
  const h = renderer.domElement.height, tanH = Math.tan(camera.fov*DEG/2);
  const far = 1 - sstep(2e5, 2e6, camera.position.length());
  for (let i = 0; i < dotBodies.length; i++){
    const b = dotBodies[i];
    b.getPos(_a);
    dotPos[i*3] = _a.x; dotPos[i*3+1] = _a.y; dotPos[i*3+2] = _a.z;
    const dist = Math.max(1e-6, camera.position.distanceTo(_a));
    const rpx = b.R/(dist*tanH)*(h/2);
    let a = (1 - sstep(1.0, 2.6, rpx))*far;
    if (b.isMoon){ b.parent.getPos(_c); const sep = _a.distanceTo(_c)/(dist*tanH)*(h/2); a *= sstep(4, 10, sep); }
    const lit = 0.55 + 0.45*Math.max(0, _b.copy(_a).negate().normalize().dot(_c.copy(camera.position).sub(_a).normalize()));
    const c = dotColors[i];
    dotCol[i*4] = c[0]*lit; dotCol[i*4+1] = c[1]*lit; dotCol[i*4+2] = c[2]*lit; dotCol[i*4+3] = a*(b.isMoon ? 0.55 : 0.9);
  }
  dotGeo.attributes.position.needsUpdate = true; dotGeo.attributes.aCol.needsUpdate = true;
}
function updatePulse(now){
  const t = (now - pulseT0)/1600;
  if (!pulseBody || t > 1){ pulse.material.opacity = 0; return; }
  pulseBody.getPos(_a);
  const dist = camera.position.distanceTo(_a);
  const base = Math.max(pulseBody.R*1.25, dist*0.03);
  pulse.position.copy(_a);
  pulse.scale.setScalar(base*2*(1 + 0.45*easeIO(t)));
  pulse.material.opacity = 0.42*Math.sin(PI*Math.min(1, t*1.15))*(1 - t);
}

/* ═══════════════════════ BOOT ═══════════════════════ */
buildCosmos();
buildBackdrop();
buildBlackHoles();
upgradeNebulae();
buildGlobulars();
buildRoadster();
buildPOI();
buildGalaxyModel();
buildGalaxyPlanes();
buildMagellanic();
buildDeepSky();
bakePanorama();
buildSkyStars();
buildOrbits(simDays/36525);
orbitsBuiltFor = simDays;
fetchJSON(D3('mw.json')).then(geo => {
  if (!geo || !geo.features) return;
  try { rasterizeMilkyWay(geo); bakePanorama(); buildSkyStars(); } catch(e){}
});
fetchJSON(D3(Q.cat === '8' ? 'stars.8.json' : 'stars.6.json')).then(async j => {
  if (!j && Q.cat === '8') j = await fetchJSON(D3('stars.6.json'));
  if (j && j.features) try { buildCatalog(j); } catch(e){}
});

let last = performance.now(), t0 = last, frames = 0;
function startIntro(){
  ctl.anchor.set(0, 0, 0); ctl.yaw = 0.55; ctl.pitch = 0.42; ctl.logD = Math.log(8.5e10*LYU); ctl.autoYaw = 0.02;
  introPending = true;
}
let introPending = false;
function scheduleIntroDescent(){
  introPending = false;
  introTimer = setTimeout(() => {
    introTimer = null;
    flyTo({ body:sunBody, D:1800, yaw:1.05, pitch:0.42, dur:INTRO_SECONDS, arc:0, intro:true });
  }, 3600);
}
if (!QS.has('nointro')) startIntro(); else { ctl.focus = sunBody; ctl.logD = Math.log(1800); ctl.pitch = 0.42; ctl.yaw = 1.05; }
/* Black-frame watchdog: reads a few pixels of the freshly drawn frame; if the picture is empty it steps down through ever simpler pipelines. */
let wdLevel = 0, wdBad = 0;
const WD_AT = new Set([12, 40, 90, 180, 360, 720]);
function watchdog(){
  if (!WD_AT.has(frames)) return;
  const gl = renderer.getContext(), w = gl.drawingBufferWidth, h = gl.drawingBufferHeight, px = new Uint8Array(4);
  let sum = 0, n = 0, mx = 0;
  for (let i = 0; i < 6; i++) for (let j = 0; j < 6; j++){
    gl.readPixels(((i + 0.5)/6*w) | 0, ((j + 0.5)/6*h) | 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
    const l = px[0] + px[1] + px[2]; sum += l; n++; mx = Math.max(mx, l);
  }
  const mean = sum/(3*n);
  window.__wd = { frames, mean, mx, level:wdLevel };
  if (mean >= 1.2 && mx > 6){ wdBad = 0; if (frames > 40 && window.__cosmosReady) window.__cosmosReady(); return; }
  wdBad++; wdLevel++;
  if (wdLevel === 1){ bloomPass.enabled = false; if (smaaPass) smaaPass.enabled = false; window.__noBH = true; }
  else if (wdLevel === 2){ NOCOMP = true; }
  else if (wdLevel >= 3){ if (window.__cosmosFail){ window.__cosmosReady = null; window.__cosmosFail(); } }
  WD_AT.add(frames + 8);
}
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now - last)/1000);
  last = now;
  const realT = (now - t0)/1000;
  const target = manualRate ? SPEEDS[speedIdx] : (() => { const D = Math.exp(ctl.logD); const t = sstep(Math.log(30), Math.log(5000), Math.log(D)); return Math.exp(lerp(Math.log(1/24), Math.log(5), t)); })();
  simRate = Math.exp(lerp(Math.log(simRate), Math.log(target), 1 - Math.exp(-dt*(manualRate ? 6 : 1.5))));
  if (playing){ simDays += dt*simRate*direction; simDays = clamp(simDays, -1.5e6, 1.5e6); }
  updateBodies(realT);
  updateRoadster(realT, simDays);
  updateCamera(dt, now);
  updateLayers(realT);
  if (solarVisible){ updateGlare(); updateDots(); updatePulse(now); }
  gradePass.uniforms.uTime.value = realT;
  if (NOCOMP){ renderLayers(null); } else composer.render();
  watchdog();
  runJobs(5);
  if (++frames === 2){ if (window.__cosmosReady) window.__cosmosReady(); veil.classList.add('gone'); if (introPending) scheduleIntroDescent(); }
  if (frames > 30) adapt(dt);
}
buildPipeline(typeof blackHolePass !== 'undefined' ? blackHolePass : null);
applySize();
requestAnimationFrame(frame);
window.__cosmos = { scene, galScene, belt, kuiper, trojans, dots, coronaMesh, sunGlows, get roadster(){ return roadster; }, nebulae, globs, BH, bhById, bhPass, GAL, realIndex, setHost, galDetail, bloomPass, GC_DIR, viewAnglesFor, ctl, byId, flyTo, flyToBody, VIEW, camera, galCam, LYU, setSim:(d) => { simDays = d; }, get frames(){ return frames; }, jobs };
</script>
